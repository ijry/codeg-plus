<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 盘体：品红 -->
    <linearGradient id="disc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4081"/>
      <stop offset="100%" style="stop-color:#e91e63"/>
    </linearGradient>
    <!-- 绳与指圈：黄 -->
    <linearGradient id="string" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffeb3b"/>
      <stop offset="100%" style="stop-color:#fdd835"/>
    </linearGradient>
    <!-- 轴芯：亮灰 -->
    <linearGradient id="axle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dcdfe9"/>
      <stop offset="100%" style="stop-color:#cdd1e2"/>
    </linearGradient>
  </defs>

  <!-- 圆角矩形背景 -->
  <rect x="0" y="0" width="512" height="512" rx="90" ry="90" fill="#1a1a2e"/>

  <!-- 悠悠球盘体，中缝槽分出两瓣 -->
  <circle cx="256" cy="232" r="158" fill="url(#disc)"/>
  <rect x="94" y="220" width="324" height="24" fill="#1a1a2e"/>
  <rect x="224" y="216" width="64" height="32" rx="10" fill="url(#axle)"/>

  <!-- 绳：从轴芯沿缝槽滑出，贴缘甩下收一个小圈 -->
  <path d="M 300 232 C 370 232 430 244 448 276 C 462 302 456 348 428 380 C 414 394 408 402 402 410"
    fill="none" stroke="url(#string)" stroke-width="22" stroke-linecap="round"/>
  <circle cx="388" cy="436" r="26" fill="none" stroke="url(#string)" stroke-width="22"/>
</svg>
